[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rust-python-lib"
version = "0.1.0"
description = """ A super simple Python project that uses a library and such implemented in Rust. """
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.26.0",
]

[tool.maturin]
module-name = "rust_python_lib"
bindings = "pyo3"
features = ["python"]
