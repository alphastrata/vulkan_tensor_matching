[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "vulkan_tensor_matching"
version = "0.1.0"
description = "GPU-accelerated template matching using Vulkan compute shaders"
requires-python = ">=3.10"

[tool.maturin]
features = ["python"]

[dependency-groups]
dev = [
    "maturin>=1.0",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pillow>=10.0",
    "pytest>=7.0",
]
