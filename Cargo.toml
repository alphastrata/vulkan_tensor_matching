[package]
name = "vulkan_tensor_matching"
version = "0.1.0"
edition = "2024"
authors = ["jer <alphastrata@gmail.com>"]
description = "GPU-accelerated template matching using Vulkan compute shaders"

[lib]
name = "vulkan_tensor_matching"
crate-type = ["cdylib", "rlib"]

[[example]]
name = "lenna_vulkan_matching"
path = "examples/lenna_vulkan_matching.rs"

[[example]]
name = "single_match"
path = "examples/single_match.rs"

[dependencies]
ash = "0.38"
ash-window = "0.13"
image = "0.25"
bytemuck = { version = "1.19", features = ["derive"] }
thiserror = "2.0"
gpu-allocator = { version = "0.28", features = ["vulkan"] }
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
ab_glyph = "0.2"
imageproc = "0.26"
pyo3 = { version = "0.28", features = ["extension-module"], optional = true }

[build-dependencies]
shaderc = "0.10"
walkdir = "2.4"

[dev-dependencies]
test-case = "3.3"

[features]
default = []
python = ["dep:pyo3"]
